<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <style>
      .zone{fill:#f1f5f9;stroke:#94a3b8;stroke-dasharray:6 4}
      .box{fill:#ffffff;stroke:#334155;stroke-width:1.3}
      .core{fill:#e0ecff;stroke:#2f6bb3;stroke-width:1.5}
      .ext{fill:#fff7e8;stroke:#c2410c;stroke-width:1.2}
      .later{fill:#ffffff;stroke:#94a3b8;stroke-width:1.2;stroke-dasharray:5 4}
      .hum{fill:#fef9c3;stroke:#a16207;stroke-width:1.3}
      .stop{fill:#fef2f2;stroke:#b91c1c;stroke-width:1.2}
      .ok{fill:#ecfdf3;stroke:#15803d;stroke-width:1.3}
      .ai{fill:#f3e8ff;stroke:#7e22ce;stroke-width:1.3}
      .h{font-weight:600;fill:#0f172a}
      .t{font-weight:600;fill:#1e293b;font-size:13.5px}
      .s{fill:#475569;font-size:12px}
      .line{stroke:#475569;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .dash{stroke:#475569;stroke-width:1.3;fill:none;stroke-dasharray:5 4;marker-end:url(#a)}
      .lbl{fill:#1e293b;font-size:12px;font-weight:600}
    </style>
  </defs>
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="30" y="36" class="h" font-size="20">AI / LLM call path</text>
  <text x="30" y="58" class="s">Every model call goes through the gateway; any refusal or failure falls back to the computed, cited path.</text>
  <rect x="30" y="90" width="212" height="90" rx="10" class="core"/>
  <text x="42" y="114" class="t">Caller</text>
  <text x="42" y="134" class="s">a NAM feature (dlp.disposition,</text>
  <text x="42" y="151" class="s">crosstool.summary, compliance.draft ...)</text>
  <path d="M244,135 L260,135" class="line"/>
  <rect x="262" y="90" width="212" height="90" rx="10" class="core"/>
  <text x="274" y="114" class="t">Usage policy</text>
  <text x="274" y="134" class="s">feature on? budget left?</text>
  <text x="274" y="151" class="s">person&#x27;s limit? model by name</text>
  <path d="M476,135 L492,135" class="line"/>
  <rect x="494" y="90" width="212" height="90" rx="10" class="core"/>
  <text x="506" y="114" class="t">Redaction</text>
  <text x="506" y="134" class="s">users, names, hosts, IPs,</text>
  <text x="506" y="151" class="s">phone, card, national ids -&gt; tokens</text>
  <path d="M708,135 L724,135" class="line"/>
  <rect x="726" y="90" width="212" height="90" rx="10" class="core"/>
  <text x="738" y="114" class="t">Approved endpoint</text>
  <text x="738" y="134" class="s">NAM&#x27;s environment or an</text>
  <text x="738" y="151" class="s">Indian region; https only</text>
  <path d="M940,135 L956,135" class="line"/>
  <rect x="958" y="90" width="212" height="90" rx="10" class="ai"/>
  <text x="970" y="114" class="t">Model</text>
  <text x="970" y="134" class="s">answers JSON with</text>
  <text x="970" y="151" class="s">citations to evidence ids</text>
  <rect x="960" y="230" width="212" height="90" rx="10" class="core"/>
  <text x="972" y="254" class="t">Checks</text>
  <text x="972" y="274" class="s">untrusted JSON typed; uncited and</text>
  <text x="972" y="291" class="s">figure-changing statements dropped</text>
  <path d="M958,275 L942,275" class="line"/>
  <rect x="728" y="230" width="212" height="90" rx="10" class="core"/>
  <text x="740" y="254" class="t">Restore</text>
  <text x="740" y="274" class="s">tokens back to names, one map</text>
  <text x="740" y="291" class="s">per call, never shared</text>
  <path d="M726,275 L710,275" class="line"/>
  <rect x="496" y="230" width="212" height="90" rx="10" class="core"/>
  <text x="508" y="254" class="t">Record</text>
  <text x="508" y="274" class="s">prompt (pseudonymised), answer, tokens,</text>
  <text x="508" y="291" class="s">removals and why; AI decision record</text>
  <path d="M494,275 L478,275" class="line"/>
  <rect x="264" y="230" width="212" height="90" rx="10" class="ok"/>
  <text x="276" y="254" class="t">Use</text>
  <text x="276" y="274" class="s">text shown; a DLP decision stored</text>
  <text x="276" y="291" class="s">beside the computed one (shadow)</text>
  <path d="M1066,182 L1066,228" class="line"/>
  <rect x="30" y="370" width="560" height="110" rx="10" class="stop"/>
  <text x="42" y="394" class="t">Refused or failed -&gt; computed path</text>
  <text x="42" y="414" class="s">over budget / limit, feature off, endpoint not approved,</text>
  <text x="42" y="431" class="s">timeout, circuit open, no valid citation: the platform&#x27;s own</text>
  <text x="42" y="448" class="s">cited text; dispositions and every figure identical</text>
  <rect x="610" y="370" width="560" height="110" rx="10" class="hum"/>
  <text x="622" y="394" class="t">Never decided by the model</text>
  <text x="622" y="414" class="s">figures, scores, severity · containment · reportability ·</text>
  <text x="622" y="431" class="s">rule changes in the tool · anything at the decide stage</text>
  <text x="622" y="448" class="s">(refused in code in this version)</text>
  <rect x="30" y="500" width="1140" height="70" rx="10" class="box"/>
  <text x="42" y="524" class="t">Text an insider writes (message, subject, file names) is passed fenced as data and read by no rule; a test injects instructions and proves nothing changes.</text>
  <text x="42" y="544" class="s"></text>
</svg>
