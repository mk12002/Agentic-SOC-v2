<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <style>
      .zone{fill:#f1f5f9;stroke:#94a3b8;stroke-dasharray:6 4}
      .box{fill:#ffffff;stroke:#334155;stroke-width:1.3}
      .core{fill:#e0ecff;stroke:#2f6bb3;stroke-width:1.5}
      .ext{fill:#fff7e8;stroke:#c2410c;stroke-width:1.2}
      .later{fill:#ffffff;stroke:#94a3b8;stroke-width:1.2;stroke-dasharray:5 4}
      .hum{fill:#fef9c3;stroke:#a16207;stroke-width:1.3}
      .stop{fill:#fef2f2;stroke:#b91c1c;stroke-width:1.2}
      .ok{fill:#ecfdf3;stroke:#15803d;stroke-width:1.3}
      .ai{fill:#f3e8ff;stroke:#7e22ce;stroke-width:1.3}
      .h{font-weight:600;fill:#0f172a}
      .t{font-weight:600;fill:#1e293b;font-size:13.5px}
      .s{fill:#475569;font-size:12px}
      .line{stroke:#475569;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .dash{stroke:#475569;stroke-width:1.3;fill:none;stroke-dasharray:5 4;marker-end:url(#a)}
      .lbl{fill:#1e293b;font-size:12px;font-weight:600}
    </style>
  </defs>
  <rect width="1200" height="680" fill="#ffffff"/>
  <text x="30" y="36" class="h" font-size="20">Hosting model and network connectivity</text>
  <text x="30" y="58" class="s">Everything inbound arrives over HTTPS at one ingress; everything outbound goes to a listed destination only.</text>
  <rect x="40" y="90" width="200" height="80" rx="10" class="hum"/>
  <text x="52" y="114" class="t">NAM&#x27;s users</text>
  <text x="52" y="134" class="s">browser, HTTPS 443</text>
  <rect x="40" y="200" width="200" height="80" rx="10" class="ext"/>
  <text x="52" y="224" class="t">NAM&#x27;s SIEM</text>
  <text x="52" y="244" class="s">POST /api/v1/ingest/alerts</text>
  <text x="52" y="261" class="s">HTTPS 443, X-API-Key</text>
  <rect x="280" y="70" width="600" height="560" rx="12" class="zone"/>
  <text x="292" y="90" class="lbl">NAM&#x27;s environment or an Indian cloud region (one VNet / cluster)</text>
  <rect x="310" y="110" width="540" height="70" rx="10" class="box"/>
  <text x="322" y="134" class="t">Ingress: TLS 1.2+ proxy / application gateway (WAF)</text>
  <text x="322" y="154" class="s">shared rate limit · only path to the API</text>
  <rect x="310" y="220" width="250" height="110" rx="10" class="core"/>
  <text x="322" y="244" class="t">API pods (2+)</text>
  <text x="322" y="264" class="s">port 8080, non-root,</text>
  <text x="322" y="281" class="s">read-only filesystem,</text>
  <text x="322" y="298" class="s">default-deny network policy</text>
  <rect x="600" y="220" width="250" height="110" rx="10" class="core"/>
  <text x="612" y="244" class="t">Scheduler pods (1+)</text>
  <text x="612" y="264" class="s">no inbound port;</text>
  <text x="612" y="281" class="s">database leases decide</text>
  <text x="612" y="298" class="s">which pod runs a job</text>
  <rect x="310" y="380" width="540" height="90" rx="10" class="box"/>
  <text x="322" y="404" class="t">PostgreSQL (HA, TLS verify-full)</text>
  <text x="322" y="424" class="s">runtime role: no schema rights, audit log append-only;</text>
  <text x="322" y="441" class="s">backups and point-in-time restore in the same region</text>
  <rect x="310" y="510" width="540" height="90" rx="10" class="box"/>
  <text x="322" y="534" class="t">Secrets: vault mounted as files (*_FILE)</text>
  <text x="322" y="554" class="s">connector keys, data key, model key, webhook URLs - never in config or code</text>
  <path d="M242,130 L308,140" class="line"/>
  <text x="281.0" y="131.0" class="lbl">443</text>
  <path d="M242,240 L308,160" class="line"/>
  <text x="281.0" y="196.0" class="lbl">443</text>
  <path d="M435,182 L435,218" class="line"/>
  <path d="M435,332 L435,378" class="line"/>
  <path d="M725,332 L725,378" class="line"/>
  <rect x="920" y="90" width="250" height="100" rx="10" class="ext"/>
  <text x="932" y="114" class="t">NAM&#x27;s tools (HTTPS 443)</text>
  <text x="932" y="134" class="s">Forcepoint · Silverfort · Trend Micro</text>
  <text x="932" y="151" class="s">· Trellix ePO · directory export</text>
  <text x="932" y="168" class="s">· ServiceNow / Jira</text>
  <rect x="920" y="220" width="250" height="80" rx="10" class="ai"/>
  <text x="932" y="244" class="t">Model endpoint (optional)</text>
  <text x="932" y="264" class="s">NAM&#x27;s gateway or an Indian-region</text>
  <text x="932" y="281" class="s">model; approved list only</text>
  <rect x="920" y="330" width="250" height="70" rx="10" class="ext"/>
  <text x="932" y="354" class="t">login.microsoftonline.com</text>
  <text x="932" y="374" class="s">Entra sign-in keys</text>
  <rect x="920" y="430" width="250" height="70" rx="10" class="ext"/>
  <text x="932" y="454" class="t">Notification webhooks</text>
  <text x="932" y="474" class="s">Teams / Slack (https only)</text>
  <path d="M852,270 L918,140" class="line"/>
  <text x="891.0" y="201.0" class="lbl">egress</text>
  <path d="M852,280 L918,260" class="line"/>
  <path d="M852,290 L918,360" class="line"/>
  <path d="M852,300 L918,460" class="line"/>
  <text x="920" y="540" class="s">Nothing else leaves: no public feeds, no URLs from messages,</text>
  <text x="920" y="558" class="s">no telemetry. Raw vendor logs stay in the region.</text>
</svg>
