<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <style>
      .zone{fill:#f1f5f9;stroke:#94a3b8;stroke-dasharray:6 4}
      .box{fill:#ffffff;stroke:#334155;stroke-width:1.3}
      .core{fill:#e0ecff;stroke:#2f6bb3;stroke-width:1.5}
      .ext{fill:#fff7e8;stroke:#c2410c;stroke-width:1.2}
      .later{fill:#ffffff;stroke:#94a3b8;stroke-width:1.2;stroke-dasharray:5 4}
      .hum{fill:#fef9c3;stroke:#a16207;stroke-width:1.3}
      .stop{fill:#fef2f2;stroke:#b91c1c;stroke-width:1.2}
      .ok{fill:#ecfdf3;stroke:#15803d;stroke-width:1.3}
      .ai{fill:#f3e8ff;stroke:#7e22ce;stroke-width:1.3}
      .h{font-weight:600;fill:#0f172a}
      .t{font-weight:600;fill:#1e293b;font-size:13.5px}
      .s{fill:#475569;font-size:12px}
      .line{stroke:#475569;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .dash{stroke:#475569;stroke-width:1.3;fill:none;stroke-dasharray:5 4;marker-end:url(#a)}
      .lbl{fill:#1e293b;font-size:12px;font-weight:600}
    </style>
  </defs>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="30" y="36" class="h" font-size="20">Data flow - a DLP incident from the tool to a decision</text>
  <text x="30" y="58" class="s">Structured facts decide; text a sender wrote is kept apart and fenced. Every step is audited.</text>
  <rect x="30" y="90" width="212" height="110" rx="10" class="core"/>
  <text x="42" y="114" class="t">1 Read</text>
  <text x="42" y="134" class="s">the dlp job syncs Forcepoint</text>
  <text x="42" y="151" class="s">incidents + context streams;</text>
  <text x="42" y="168" class="s">each page committed</text>
  <path d="M244,145 L260,145" class="line"/>
  <rect x="262" y="90" width="212" height="110" rx="10" class="core"/>
  <text x="274" y="114" class="t">2 Resolve</text>
  <text x="274" y="134" class="s">sender and device to one</text>
  <text x="274" y="151" class="s">person and one device of</text>
  <text x="274" y="168" class="s">the AD baseline</text>
  <path d="M476,145 L492,145" class="line"/>
  <rect x="494" y="90" width="212" height="110" rx="10" class="core"/>
  <text x="506" y="114" class="t">3 Facts F1...</text>
  <text x="506" y="134" class="s">data classes, bulk, destination</text>
  <text x="506" y="151" class="s">class, privileged, identity risk,</text>
  <text x="506" y="168" class="s">device controls</text>
  <path d="M708,145 L724,145" class="line"/>
  <rect x="726" y="90" width="212" height="110" rx="10" class="ok"/>
  <text x="738" y="114" class="t">4 Judge</text>
  <text x="738" y="134" class="s">published decision table:</text>
  <text x="738" y="151" class="s">escalate / close / a person;</text>
  <text x="738" y="168" class="s">never-automatic list</text>
  <path d="M940,145 L956,145" class="line"/>
  <rect x="958" y="90" width="212" height="110" rx="10" class="core"/>
  <text x="970" y="114" class="t">5 Case</text>
  <text x="970" y="134" class="s">escalation -&gt; data-protection</text>
  <text x="970" y="151" class="s">case; personal data -&gt; breach</text>
  <text x="970" y="168" class="s">assessment (Dome Comply)</text>
  <rect x="30" y="250" width="330" height="110" rx="10" class="stop"/>
  <text x="42" y="274" class="t">Untrusted: subject, file names, body</text>
  <text x="42" y="294" class="s">kept apart; shown to the analyst;</text>
  <text x="42" y="311" class="s">passed to the model fenced as data;</text>
  <text x="42" y="328" class="s">read by no rule</text>
  <rect x="400" y="250" width="242" height="110" rx="10" class="core"/>
  <text x="412" y="274" class="t">6 Investigate</text>
  <text x="412" y="294" class="s">read-only look-ups from a</text>
  <text x="412" y="311" class="s">fixed menu (model or rules);</text>
  <text x="412" y="328" class="s">findings I1...</text>
  <path d="M644,305 L660,305" class="line"/>
  <rect x="662" y="250" width="242" height="110" rx="10" class="ai"/>
  <text x="674" y="274" class="t">7 AI decides (shadow)</text>
  <text x="674" y="294" class="s">close / escalate citing F / I;</text>
  <text x="674" y="311" class="s">stored beside the computed</text>
  <text x="674" y="328" class="s">one; nothing acts on it</text>
  <path d="M906,305 L922,305" class="line"/>
  <rect x="924" y="250" width="242" height="110" rx="10" class="hum"/>
  <text x="936" y="274" class="t">8 A person rules</text>
  <text x="936" y="294" class="s">analyst closes or escalates;</text>
  <text x="936" y="311" class="s">at recommend the AI&#x27;s decision</text>
  <text x="936" y="328" class="s">is pre-filled, overrule = reason</text>
  <path d="M362,305 L398,305" class="line"/>
  <text x="362" y="296" class="lbl">fenced</text>
  <rect x="30" y="400" width="1140" height="70" rx="10" class="box"/>
  <text x="42" y="424" class="t">Feeds back: agreement per decision type (promotion / demotion) · rule-change suggestions · pilot KPIs · Dome Score (open DLP cases) · cross-tool rules</text>
  <text x="42" y="444" class="s">Stored: PostgreSQL in the region (alerts, facts, decisions, cases) · original vendor payloads only if SOC_STORE_RAW_PAYLOADS=1, encrypted</text>
  <rect x="30" y="500" width="560" height="170" rx="10" class="box"/>
  <text x="42" y="524" class="t">What leaves the deployment</text>
  <text x="42" y="544" class="s">to NAM&#x27;s tools: reads (and, in Phase 3, approved actions)</text>
  <text x="42" y="561" class="s">to the model (if on): pseudonymised evidence, approved endpoint</text>
  <text x="42" y="578" class="s">to webhooks: finding title, severity, a link</text>
  <text x="42" y="595" class="s">nothing else</text>
  <rect x="610" y="500" width="560" height="170" rx="10" class="box"/>
  <text x="622" y="524" class="t">Retention and protection</text>
  <text x="622" y="544" class="s">encryption at rest (Fernet) for stored files and reports</text>
  <text x="622" y="561" class="s">TLS to the database (verify-full) and to every tool</text>
  <text x="622" y="578" class="s">retention per setting, legal hold on open cases</text>
  <text x="622" y="595" class="s">hash-chained audit log, never pruned by the platform</text>
</svg>
