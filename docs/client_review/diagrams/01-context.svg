  <rect x="55" y="510" width="145" height="80" rx="10" class="box"/>
  <text x="67" y="534" class="t">Forcepoint DLP</text>
  <text x="67" y="554" class="s">incidents, agents,</text>
  <text x="67" y="571" class="s">health, rules</text>
