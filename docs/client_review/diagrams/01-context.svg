  <rect x="683" y="510" width="145" height="80" rx="10" class="box"/>
  <text x="695" y="534" class="t">AD / CMDB export</text>
  <text x="695" y="554" class="s">devices, people,</text>
  <text x="695" y="571" class="s">policy groups</text>
  <path d="M755,508 L608,424" class="line"/>
  <rect x="840" y="510" width="145" height="80" rx="10" class="box"/>
  <text x="852" y="534" class="t">SIEM</text>
  <text x="852" y="554" class="s">pushes alerts</text>
  <text x="852" y="571" class="s">(webhook)</text>
  <rect x="997" y="510" width="145" height="80" rx="10" class="box"/>
  <text x="1009" y="534" class="t">ServiceNow / Jira</text>
  <text x="1009" y="554" class="s">tickets</text>
  <text x="1009" y="571" class="s"></text>
  <path d="M1069,508 L632,424" class="line"/>
  <path d="M912,508 L620,424" class="line"/>
  <rect x="220" y="610" width="240" height="70" rx="10" class="later"/>
  <text x="232" y="634" class="t">Arcon (PAM)</text>
  <text x="232" y="654" class="s">check-outs, sessions</text>
  <rect x="480" y="610" width="240" height="70" rx="10" class="later"/>
  <text x="492" y="634" class="t">Cloudflare (WAF)</text>
  <text x="492" y="654" class="s">security events</text>
  <rect x="740" y="610" width="240" height="70" rx="10" class="later"/>
  <text x="752" y="634" class="t">SOAR</text>
  <text x="752" y="654" class="s">executes approved actions</text>
</svg>
