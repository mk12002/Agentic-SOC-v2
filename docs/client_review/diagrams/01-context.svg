  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="30" y="36" class="h" font-size="20">CyberDome for NAM - system context</text>
  <text x="30" y="58" class="s">One layer above NAM&#x27;s security tools, inside NAM&#x27;s environment or an Indian cloud region. Reads first; acts only with people&#x27;s approval.</text>
  <rect x="400" y="80" width="400" height="70" rx="10" class="hum"/>
  <text x="412" y="104" class="t">NAM&#x27;s people</text>
  <text x="412" y="124" class="s">SOC analysts and lead · CISO · engineers · compliance · auditors</text>
  <text x="412" y="141" class="s">HTTPS · Entra ID sign-in · MFA for every decision</text>
  <rect x="40" y="180" width="1120" height="270" rx="12" class="zone"/>
  <text x="52" y="200" class="lbl">NAM&#x27;s environment or an Indian cloud region</text>
  <rect x="340" y="210" width="520" height="210" rx="10" class="core"/>
  <text x="352" y="234" class="t">CyberDome</text>
  <text x="352" y="254" class="s">Dome Connect - tool health, configuration changes</text>
  <text x="352" y="271" class="s">Dome Graph - control coverage against the AD baseline</text>
  <text x="352" y="288" class="s">Dome Agents - DLP triage, investigator, rule changes</text>
  <text x="352" y="305" class="s">Cross-tool cases - one case per person, N tools agree</text>
  <text x="352" y="322" class="s">Dome Score - CISO view, adjustable weights</text>
  <text x="352" y="339" class="s">Dome Comply - SEBI CSCRF, DPDP, CERT-In evidence; reportability</text>
  <text x="352" y="356" class="s">Pilot scorecard · cases · approvals · audit chain</text>
  <rect x="60" y="220" width="240" height="90" rx="10" class="box"/>
  <text x="72" y="244" class="t">PostgreSQL</text>
  <text x="72" y="264" class="s">all state, encrypted files,</text>
  <text x="72" y="281" class="s">hash-chained audit log</text>
  <rect x="60" y="330" width="240" height="90" rx="10" class="ai"/>
  <text x="72" y="354" class="t">Model (optional)</text>
  <text x="72" y="374" class="s">in NAM&#x27;s environment or an Indian</text>
  <text x="72" y="391" class="s">region; pseudonymised prompts only</text>
  <rect x="900" y="220" width="240" height="90" rx="10" class="ext"/>
  <text x="912" y="244" class="t">Microsoft Entra ID</text>
  <text x="912" y="264" class="s">sign-in, app roles,</text>
  <text x="912" y="281" class="s">Conditional Access (MFA)</text>
  <rect x="900" y="330" width="240" height="90" rx="10" class="ext"/>
  <text x="912" y="354" class="t">Teams / Slack / webhook</text>
  <text x="912" y="374" class="s">findings above a threshold</text>
  <text x="912" y="391" class="s">(optional, https only)</text>
