  <text x="224" y="554" class="s">risky</text>
  <text x="224" y="571" class="s">authentications</text>
  <path d="M284,508 L572,424" class="line"/>
  <rect x="369" y="510" width="145" height="80" rx="10" class="box"/>
  <text x="381" y="534" class="t">Trend Micro</text>
  <text x="381" y="554" class="s">agents, alerts</text>
  <text x="381" y="571" class="s">(isolate: 2 people)</text>
  <path d="M441,508 L584,424" class="line"/>
  <rect x="526" y="510" width="145" height="80" rx="10" class="box"/>
  <text x="538" y="534" class="t">Trellix ePO</text>
