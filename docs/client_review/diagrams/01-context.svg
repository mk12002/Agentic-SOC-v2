  <path d="M338,265 L302,265" class="line"/>
  <path d="M338,375 L302,375" class="line"/>
  <path d="M862,265 L898,265" class="line"/>
  <path d="M862,375 L898,375" class="line"/>
  <rect x="40" y="480" width="1120" height="220" rx="12" class="zone"/>
