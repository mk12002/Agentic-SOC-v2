<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <style>
      .zone{fill:#f1f5f9;stroke:#94a3b8;stroke-dasharray:6 4}
      .box{fill:#ffffff;stroke:#334155;stroke-width:1.3}
      .core{fill:#e0ecff;stroke:#2f6bb3;stroke-width:1.5}
      .ext{fill:#fff7e8;stroke:#c2410c;stroke-width:1.2}
      .later{fill:#ffffff;stroke:#94a3b8;stroke-width:1.2;stroke-dasharray:5 4}
      .hum{fill:#fef9c3;stroke:#a16207;stroke-width:1.3}
      .stop{fill:#fef2f2;stroke:#b91c1c;stroke-width:1.2}
      .ok{fill:#ecfdf3;stroke:#15803d;stroke-width:1.3}
      .ai{fill:#f3e8ff;stroke:#7e22ce;stroke-width:1.3}
      .h{font-weight:600;fill:#0f172a}
      .t{font-weight:600;fill:#1e293b;font-size:13.5px}
      .s{fill:#475569;font-size:12px}
      .line{stroke:#475569;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .dash{stroke:#475569;stroke-width:1.3;fill:none;stroke-dasharray:5 4;marker-end:url(#a)}
      .lbl{fill:#1e293b;font-size:12px;font-weight:600}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="30" y="36" class="h" font-size="20">Components and layers</text>
  <text x="30" y="58" class="s">Dependencies point down only: API -&gt; intelligence -&gt; domains -&gt; core -&gt; connectors. The model is a leaf; everything works without it.</text>
  <rect x="40" y="80" width="880" height="80" rx="10" class="core"/>
  <text x="52" y="104" class="t">Console (static SPA, strict CSP)</text>
  <text x="52" y="124" class="s">Dome Score · Pilot · Cases · Approvals · Data protection · Coverage · Changes · Comply · Govern screens; menu by product and data scope</text>
  <path d="M480,160 L480,178" class="line"/>
  <rect x="40" y="180" width="880" height="80" rx="10" class="core"/>
  <text x="52" y="204" class="t">API (FastAPI)</text>
  <text x="52" y="224" class="s">body cap · rate limit · scope 404 · authentication (Entra, keys, break-glass) · permission per route · commit before reply · access log</text>
  <path d="M480,260 L480,278" class="line"/>
  <rect x="40" y="280" width="880" height="80" rx="10" class="core"/>
  <text x="52" y="304" class="t">Intelligence</text>
  <text x="52" y="324" class="s">posture + weights · CISO view · cross-tool rules · control coverage · tool health · configuration snapshots · risk · correlation · Q&amp;A</text>
  <path d="M480,360 L480,378" class="line"/>
  <rect x="40" y="380" width="880" height="80" rx="10" class="core"/>
  <text x="52" y="404" class="t">Domains and reporting</text>
  <text x="52" y="424" class="s">DLP triage (facts, decision table, cases) · AI investigator · DLP rule changes · incident (SIEM alerts) · Dome Comply · breach assessments · pilot · reports</text>
  <path d="M480,460 L480,478" class="line"/>
  <rect x="40" y="480" width="880" height="80" rx="10" class="core"/>
  <text x="52" y="504" class="t">Core</text>
  <text x="52" y="524" class="s">context store + entity resolution · controls · earned autonomy (decisions) · cases · actions + autonomy policy (containment) · audit chain · access · watch lists · scope</text>
  <path d="M480,560 L480,578" class="line"/>
  <rect x="40" y="580" width="880" height="80" rx="10" class="box"/>
  <text x="52" y="604" class="t">Connectors</text>
  <text x="52" y="624" class="s">directory export · Forcepoint DLP · Silverfort · Trend Micro · Trellix ePO · generic SIEM webhook · ServiceNow · Jira · ownership CSV  (fake mode until APIs are confirmed)</text>
  <rect x="950" y="80" width="210" height="180" rx="10" class="ai"/>
  <text x="962" y="104" class="t">LLM gateway</text>
  <text x="962" y="124" class="s">usage policy (budgets,</text>
  <text x="962" y="141" class="s">per-person limits, model</text>
  <text x="962" y="158" class="s">per feature) · redaction ·</text>
  <text x="962" y="175" class="s">approved endpoints ·</text>
  <text x="962" y="192" class="s">citations + numeric check ·</text>
  <text x="962" y="209" class="s">circuit breaker</text>
  <rect x="950" y="290" width="210" height="120" rx="10" class="box"/>
  <text x="962" y="314" class="t">Scheduler</text>
  <text x="962" y="334" class="s">jobs in order: inventory -&gt;</text>
  <text x="962" y="351" class="s">incident -&gt; dlp -&gt; crosstool</text>
  <text x="962" y="368" class="s">-&gt; posture -&gt; snapshots ...</text>
  <text x="962" y="385" class="s">leases, retries, dead letters</text>
  <rect x="950" y="440" width="210" height="120" rx="10" class="box"/>
  <text x="962" y="464" class="t">PostgreSQL</text>
  <text x="962" y="484" class="s">context store, cases,</text>
  <text x="962" y="501" class="s">decisions, documents,</text>
  <text x="962" y="518" class="s">blobs (encrypted),</text>
  <text x="962" y="535" class="s">audit chain</text>
  <path d="M948,170 L922,170" class="line"/>
  <path d="M948,350 L922,350" class="line"/>
  <path d="M922,520 L948,520" class="line"/>
  <rect x="40" y="690" width="1120" height="50" rx="10" class="hum"/>
  <text x="52" y="714" class="t">Every decision that matters is a person&#x27;s or earned: containment four-eyes always; weights, catalogue, promotions by two leads</text>
  <text x="52" y="734" class="s"></text>
</svg>
